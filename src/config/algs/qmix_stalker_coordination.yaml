# --- QMIX with Stalker Coordination Reward ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
evaluation_epsilon: 0.0

runner: "episode"

buffer_size: 5000

# update the target network every {} episodes
target_update_interval_or_tau: 200

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False
obs_agent_role: True

# use the Q_Learner to train
standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
learner: "q_learner"
double_q: True
mixer: "qmix"
use_rnn: False
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

# Role embedding parameters
use_role_embedding: True
n_roles: 2
role_embed_dim: 8

# Unit type extraction parameters
extract_roles_from_obs: True
role_extraction_method: "fixed_mapping"
fixed_role_mapping:
  "2s3z": [0, 0, 1, 1, 1]  # Stalkers and Zealots
  "3s5z": [0, 0, 0, 1, 1, 1, 1, 1]  # Stalkers and Zealots
  "3s5z_vs_3s6z": [0, 0, 0, 1, 1, 1, 1, 1]  # Stalkers and Zealots

lr: 0.0005 
batch_size: 32
target_update_interval: 200
optim_alpha: 0.99
optim_eps: 0.00001

name: "qmix_stalker_coordination"
